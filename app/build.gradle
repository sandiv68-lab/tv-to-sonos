plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sandiv.tvtosonos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sandiv.tvtosonos'
        minSdk 29          // Android 10+: needed for capturing other apps' audio
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away by sideloading.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
