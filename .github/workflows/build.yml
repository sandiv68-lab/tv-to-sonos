name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvToSonos-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish as a download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk TvToSonos.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TvToSonos.apk --target "$GITHUB_SHA" \
            --title "TV to Sonos (latest)" --notes "Built from $GITHUB_SHA"
